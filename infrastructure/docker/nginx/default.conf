upstream vantage_web {
    server web:3000;
}

upstream vantage_api {
    server api:8000;
}

# Reject oversized bodies early; broker credentials are small.
client_max_body_size 2m;

# Map the Upgrade header so /ws can be proxied through the same server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certificates are mounted at infrastructure/nginx/certs. When they are
    # absent this block still serves plain HTTP so local compose works.
    location / {
        proxy_pass http://vantage_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # API traffic is routed at the edge; /api/health and /api/ready are probes.
    location /api/ {
        proxy_pass http://vantage_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime channel. Long read timeout so idle connections are not culled.
    location /ws {
        proxy_pass http://vantage_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
